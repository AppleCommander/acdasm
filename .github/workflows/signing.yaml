# Just experimenting with the signing component since that seems to be failing.

name: Experiment with signing component

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  signing:
    name: Signing practice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Sign with Gradle
        run: |
          echo "GPG_SIGNING_KEY_BASE64 -"
          echo $GPG_SIGNING_KEY_BASE64 | wc
          export ORG_GRADLE_PROJECT_signingKey=$(echo "$GPG_SIGNING_KEY_BASE64" | base64 -d)
          echo "signingPassword -"
          echo "$ORG_GRADLE_PROJECT_signingPassword" | wc
          echo "signingKey -"
          echo "$ORG_GRADLE_PROJECT_signingKey" | wc
          echo "signingKeyId -"
          echo "$ORG_GRADLE_PROJECT_signingKeyId" | wc
          ./gradlew :api:signMavenJavaPublication -x test
        env:
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_SIGNING_PASSPHRASE }}
          GPG_SIGNING_KEY_BASE64: ${{ secrets.GPG_SIGNING_KEY_BASE64 }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_SIGNING_KEY_ID }}
